name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pyinstaller --clean --noconfirm virmetrix.spec

      - name: Create installer zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VirMetrix\* -DestinationPath VirMetrix-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirMetrix-windows
          path: VirMetrix-windows.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VirMetrix-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}